services:
  # Node.js + Express + MongoDB Backend Service
  - type: web
    name: corelix-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        value: mongodb+srv://corelixtechnology_db_user:Corelix2026@corelixtechnology.0mtmpsm.mongodb.net/corelix?retryWrites=true&w=majority&appName=corelixtechnology

  # React + Vite Static Frontend Application
  - type: static
    name: corelix-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://corelix-backend.onrender.com/api
